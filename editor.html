<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Edit CSV</title>

  <link rel="stylesheet" href="editor.css">
</head>

<body>

  <main class="editor">

    <header class="app-header">
      <h1>Edit Items</h1>

      <div class="subtitle">
        Ignore items or add custom items. Changes are saved automatically.
      </div>
    </header>

    <section class="card">

      <div class="toolbar">

        <input id="search" type="text" placeholder="Search items...">

        <button id="addItemBtn" disabled>
          + Add Item
        </button>

      </div>

      <div id="itemList" class="item-list">
        <!-- Generated by editor.js -->
      </div>

      <div id="addedSection" class="added-section" hidden>

        <div class="section-header">
          Added Items
        </div>

        <div id="addedList" class="item-list">
        </div>

      </div>

    </section>

    <footer class="footer">

      <button id="deleteBtn" class="danger">
        🗑 Delete Cached File
      </button>

      <div class="spacer"></div>

      <span id="status">
        Ready
      </span>

      <button id="closeBtn">
        Close
      </button>

    </footer>

  </main>

  <script src="db.js"></script>
  <script src="csv.js"></script>
  <script src="editor.js"></script>

</body>

</html>
